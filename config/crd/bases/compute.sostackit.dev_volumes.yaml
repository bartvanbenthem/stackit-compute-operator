---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: volumes.compute.sostackit.dev
spec:
  group: compute.sostackit.dev
  names:
    kind: Volume
    listKind: VolumeList
    plural: volumes
    singular: volume
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.size
      name: Size
      type: integer
    - jsonPath: .status.serverId
      name: ServerId
      type: string
    - jsonPath: .status.volumeId
      name: VolumeId
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Volume is the Schema for the volumes API and represents the lifecycle of a
          single STACKIT block storage volume, or a reference to one that already
          exists.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VolumeSpec defines the desired state of a STACKIT block storage
              volume.
            properties:
              availabilityZone:
                description: AvailabilityZone the volume is placed in, e.g. "eu01-1".
                minLength: 1
                type: string
              bootable:
                description: |-
                  Bootable indicates whether the volume can be used as a server's boot
                  volume.
                type: boolean
              description:
                description: Description of the volume. Allows up to 255 characters.
                type: string
              existingId:
                description: |-
                  ExistingID references a volume that already exists in STACKIT by its
                  UUID. When set, the operator only observes the volume: it never
                  creates, updates, or deletes it, and never adds a finalizer. All other
                  spec fields except ProjectId/Region are ignored. Changing this field
                  after the resource has already been created or adopted is unsupported.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels are applied to the volume as STACKIT resource
                  labels.
                type: object
              name:
                description: |-
                  Name of the volume as it will appear in STACKIT. Defaults to the
                  resource's metadata.name when unset.
                type: string
              performanceClass:
                description: PerformanceClass of the volume, e.g. "storage_premium_perf1".
                type: string
              projectId:
                description: ProjectId is the UUID of the STACKIT project the volume
                  belongs to.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              region:
                description: Region the volume is created in, e.g. "eu01".
                minLength: 1
                type: string
              size:
                description: |-
                  Size of the volume in GB. Required unless Source is set to an image,
                  in which case STACKIT defaults to the image's minimum disk size.
                format: int64
                minimum: 1
                type: integer
              source:
                description: |-
                  Source the volume is created from. Only used at creation time; STACKIT
                  does not support changing a volume's source afterwards.
                properties:
                  id:
                    description: |-
                      Id is the UUID of the source object (image, volume, snapshot or
                      backup) the volume is created from.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                  type:
                    description: Type of the source. One of "image", "volume", "snapshot",
                      "backup".
                    enum:
                    - image
                    - volume
                    - snapshot
                    - backup
                    type: string
                required:
                - id
                - type
                type: object
            required:
            - availabilityZone
            - projectId
            - region
            type: object
          status:
            description: VolumeStatus reflects the last observed state of a STACKIT
              volume.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  volume's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent spec generation reconciled by
                  the controller.
                format: int64
                type: integer
              serverId:
                description: ServerId is the UUID of the server the volume is attached
                  to, if any.
                type: string
              size:
                description: Size currently observed on the volume in STACKIT, in
                  GB.
                format: int64
                type: integer
              state:
                description: |-
                  State mirrors the STACKIT volume status, e.g. AVAILABLE, ATTACHED,
                  CREATING, ERROR.
                type: string
              volumeId:
                description: |-
                  VolumeId is the UUID of the volume in STACKIT, whether created by this
                  resource or adopted via spec.existingId.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
