# Demonstrates referencing Network/Volume resources instead of raw STACKIT
# IDs. networkRef/bootVolumeRef are resolved to their referenced resource's
# status.<x>Id once that resource is Ready; the server is only created once
# all referenced resources are ready. Images have no corresponding CRD, so
# imageId always takes a raw STACKIT UUID.
apiVersion: compute.sostackit.dev/v1alpha1
kind: Server
metadata:
  name: web-02
spec:
  projectId: 11111111-1111-1111-1111-111111111111
  region: eu01
  machineType: c1.2
  availabilityZone: eu01-1
  imageId: 22222222-2222-2222-2222-222222222222
  networkRef:
    name: prod-network
  bootVolumeRef:
    name: web-01-boot
  keypairName: my-keypair
  labels:
    environment: dev
    team: platform
  powerState: Active
