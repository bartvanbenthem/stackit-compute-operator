# Demonstrates referencing Image/Network/Volume resources instead of raw
# STACKIT IDs. imageRef/networkRef/bootVolumeRef are resolved to their
# referenced resource's status.<x>Id once that resource is Ready; the
# server is only created once all referenced resources are ready.
apiVersion: compute.stackitvm.dev/v1alpha1
kind: Server
metadata:
  name: web-02
spec:
  projectId: 11111111-1111-1111-1111-111111111111
  region: eu01
  machineType: c1.2
  availabilityZone: eu01-1
  imageRef:
    name: ubuntu-22-04
  networkRef:
    name: prod-network
  bootVolumeRef:
    name: web-01-boot
  keypairName: my-keypair
  labels:
    environment: dev
    team: platform
  powerState: Active
