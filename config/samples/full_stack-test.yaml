# End-to-end example wiring a Network/Volume/Server together. Images have
# no corresponding CRD - replace the source.id UUID below with a real image
# ID from your STACKIT project/region (e.g. `stackit image list`).
apiVersion: compute.sostackit.dev/v1alpha1
kind: Network
metadata:
  name: service-operator-test
spec:
  projectId: cc9fd01d-494c-4d8a-850a-cbc54939a006
  region: eu01
  dhcp: true
  routed: true
  ipv4:
    prefixLength: 24
  labels:
    environment: dev
---
# list image names and uuid: stackit image list -o json | jq -r '.[] | "\(.id)\t\(.name)"'
apiVersion: compute.sostackit.dev/v1alpha1
kind: Volume
metadata:
  name: service-operator-test
spec:
  projectId: cc9fd01d-494c-4d8a-850a-cbc54939a006
  region: eu01
  availabilityZone: eu01-1
  size: 32
  bootable: true
  source:
    id: 012d2f5b-ee00-4700-9bea-cdabf0e1bfa8
    type: image
  labels:
    environment: dev
    team: platform
---
apiVersion: compute.sostackit.dev/v1alpha1
kind: Server
metadata:
  name: service-operator-test
spec:
  projectId: cc9fd01d-494c-4d8a-850a-cbc54939a006
  region: eu01
  machineType: c1.2
  availabilityZone: eu01-1
  networkRef:
    name: service-operator-test
  bootVolumeRef:
    name: service-operator-test
  labels:
    environment: dev
    team: platform
  powerState: Active